<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedPipeline · Football BI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak]{display:none!important}
    body{background:#0f0f14;color:#e5e7eb;font-family:'Inter',system-ui,sans-serif}
    .card{background:#1a1a24;border:1px solid #2a2a38;border-radius:12px}
    .btn{padding:.5rem 1rem;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;border:none;transition:.15s;display:inline-flex;align-items:center;gap:.4rem}
    .btn-primary{background:#dc143c;color:#fff}.btn-primary:hover{background:#b01030}
    .btn-ghost{background:transparent;color:#9ca3af;border:1px solid #2a2a38}.btn-ghost:hover{background:#2a2a38;color:#e5e7eb}
    .btn-sm{padding:.3rem .6rem;font-size:.75rem}
    .nav-item{display:flex;align-items:center;gap:.55rem;padding:.55rem .8rem;border-radius:8px;cursor:pointer;font-size:.875rem;transition:.15s;color:#9ca3af;font-weight:500}
    .nav-item:hover{background:#2a2a38;color:#e5e7eb}
    .nav-item.active{background:#dc143c22;color:#f87171;border-left:3px solid #dc143c}
    .stat-card{background:#1e1e2a;border:1px solid #2a2a38;border-radius:10px;padding:.8rem 1rem}
    .pill{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-size:.72rem;font-weight:600}
    .badge-pass{background:#16a34a22;color:#4ade80;border:1px solid #16a34a44}
    .badge-fail{background:#dc143c22;color:#f87171;border:1px solid #dc143c44}
    .badge-warn{background:#f59e0b22;color:#fbbf24;border:1px solid #f59e0b44}
    .badge-info{background:#3b82f622;color:#60a5fa;border:1px solid #3b82f644}
    .loader{border:3px solid #2a2a38;border-top-color:#dc143c;border-radius:50%;width:34px;height:34px;animation:spin .7s linear infinite;margin:auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    table{width:100%;border-collapse:collapse;font-size:.84rem}
    th{padding:.5rem .7rem;text-align:left;color:#6b7280;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #2a2a38}
    td{padding:.5rem .7rem;border-bottom:1px solid #1e1e2a}
    tr:hover td{background:#1e1e2a}
    select,input,textarea{background:#1e1e2a;border:1px solid #2a2a38;color:#e5e7eb;padding:.4rem .7rem;border-radius:6px;font-size:.85rem}
    select:focus,input:focus,textarea:focus{outline:none;border-color:#dc143c66}
    input[type=range]{accent-color:#dc143c;padding:0}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
    .grid-dash{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .span-2{grid-column:1 / -1}
    .drop-zone{border:2px dashed #2a2a38;border-radius:10px;padding:1.5rem;text-align:center;cursor:pointer;transition:.2s}
    .drop-zone:hover{border-color:#dc143c;background:#dc143c0a}
    ::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:#0f0f14}::-webkit-scrollbar-thumb{background:#2a2a38;border-radius:3px}
  </style>
</head>
<body x-data="bi()" x-init="init()" x-cloak>

<!-- Toast -->
<div x-show="toast" x-transition class="fixed top-4 right-4 z-[60] px-4 py-3 rounded-lg shadow-lg max-w-sm text-sm flex items-start gap-2"
     :class="toastErr ? 'bg-red-900 border border-red-700 text-red-200' : 'bg-green-900 border border-green-700 text-green-200'">
  <span x-text="toastErr ? '⚠️' : '✅'"></span><span x-text="toast" class="flex-1"></span>
  <button @click="toast=''" class="opacity-70 hover:opacity-100">✕</button>
</div>

<!-- Full-screen loader -->
<div x-show="loading" class="fixed inset-0 bg-black/60 z-[55] flex flex-col items-center justify-center gap-4">
  <div class="loader"></div><div class="text-gray-300 text-sm" x-text="loadingMsg"></div>
</div>

<div class="flex h-screen overflow-hidden">

  <!-- ════ Sidebar ════ -->
  <aside class="w-60 flex-shrink-0 flex flex-col border-r border-[#2a2a38] bg-[#12121a]">
    <div class="p-4 border-b border-[#2a2a38] flex items-center gap-2">
      <span class="text-2xl">🔴</span>
      <div>
        <div class="font-bold text-white text-sm leading-tight">RedPipeline</div>
        <div class="text-[10px] text-gray-500 uppercase tracking-widest">Football BI</div>
      </div>
    </div>

    <div class="p-3 flex-1 overflow-y-auto">
      <div class="flex items-center justify-between mb-2 px-1">
        <span class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Dashboards</span>
        <button class="btn btn-ghost btn-sm" @click="openTemplatePicker()">+ New</button>
      </div>

      <template x-if="!dbAvailable">
        <div class="text-xs text-gray-500 px-1 py-2 leading-relaxed">
          💾 Saving in this browser. Set <code class="text-gray-300">DATABASE_URL</code> to sync across devices.
        </div>
      </template>

      <div class="space-y-1">
        <template x-for="d in dashboards" :key="d.id">
          <div class="nav-item group" :class="{active: activeDash && activeDash.id===d.id}" @click="openDashboard(d)">
            <span x-text="contextIcon(d.context)"></span>
            <span class="flex-1 truncate" x-text="d.name"></span>
          </div>
        </template>
        <template x-if="dashboards.length===0">
          <div class="text-xs text-gray-600 px-1 py-2">No dashboards yet. Click <strong>+ New</strong>.</div>
        </template>
      </div>
    </div>

    <!-- Active match chip -->
    <div class="p-3 border-t border-[#2a2a38]">
      <div class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Active match</div>
      <template x-if="matchData">
        <div>
          <div class="text-xs text-white font-medium truncate" x-text="matchLabel"></div>
          <select x-show="matchData.teams.length>1" x-model="activeTeam" @change="renderDashboardCharts()" class="w-full mt-1 text-xs">
            <template x-for="t in matchData.teams" :key="t"><option :value="t" x-text="t"></option></template>
          </select>
        </div>
      </template>
      <template x-if="!matchData"><div class="text-xs text-gray-600">None loaded</div></template>
      <button class="btn btn-ghost btn-sm w-full mt-2 justify-center" @click="openMatchPicker()">⚽ Change match</button>
    </div>

    <div class="px-3 py-2 border-t border-[#2a2a38] flex items-center gap-2">
      <span class="pill" :class="dbAvailable ? 'badge-pass' : 'badge-info'" x-text="storageLabel()"></span>
    </div>
  </aside>

  <!-- ════ Main ════ -->
  <main class="flex-1 overflow-y-auto">

    <!-- Empty state -->
    <template x-if="!activeDash">
      <div class="p-10 max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold text-white mb-1">Your Football BI workspace</h1>
        <p class="text-gray-400 mb-8">Create dashboards from a template or from scratch, load real match data, and capture your suggestions — all saved for next time.</p>
        <div class="grid grid-cols-2 gap-4">
          <template x-for="t in templates" :key="t.key">
            <div class="card p-5 cursor-pointer hover:border-[#dc143c66] transition" @click="createFromTemplate(t)">
              <div class="text-3xl mb-2" x-text="t.icon"></div>
              <div class="font-bold text-white" x-text="t.name"></div>
              <div class="text-xs text-gray-500 mt-1" x-text="t.description"></div>
            </div>
          </template>
        </div>
        <div class="mt-6">
          <button class="btn btn-ghost" @click="openMatchPicker()">⚽ Load a match to analyse</button>
        </div>
      </div>
    </template>

    <!-- Dashboard view -->
    <template x-if="activeDash">
      <div class="p-5">
        <!-- Header -->
        <div class="flex items-center gap-3 mb-4">
          <span class="text-2xl" x-text="contextIcon(activeDash.context)"></span>
          <template x-if="!editMode"><h1 class="text-xl font-bold text-white" x-text="activeDash.name"></h1></template>
          <template x-if="editMode"><input x-model="activeDash.name" class="text-lg font-bold w-72"></template>
          <div class="flex-1"></div>
          <template x-if="!editMode">
            <button class="btn btn-ghost btn-sm" @click="editMode=true">✏️ Edit</button>
          </template>
          <template x-if="editMode">
            <div class="flex gap-2">
              <button class="btn btn-ghost btn-sm" @click="openWidgetCatalog()">+ Widget</button>
              <button class="btn btn-primary btn-sm" @click="saveDashboard()">💾 Save</button>
              <button class="btn btn-ghost btn-sm" @click="editMode=false;openDashboard(activeDash)">Done</button>
              <button class="btn btn-ghost btn-sm text-red-400" @click="deleteDashboard()">🗑</button>
            </div>
          </template>
        </div>

        <!-- Match-needed notice -->
        <template x-if="dashNeedsMatch() && !matchData">
          <div class="card p-4 mb-4 flex items-center gap-3 border-[#f59e0b44]">
            <span class="text-xl">⚽</span>
            <div class="flex-1 text-sm text-gray-300">This dashboard has match widgets. Load a match to populate them.</div>
            <button class="btn btn-primary btn-sm" @click="openMatchPicker()">Load match</button>
          </div>
        </template>

        <!-- Widget grid -->
        <div class="grid-dash">
          <template x-for="(w,idx) in activeDash.layout" :key="w.uid">
            <div class="card p-4" :class="{'span-2': w.w===2}">
              <!-- widget header -->
              <div class="flex items-center gap-2 mb-3">
                <template x-if="!editMode"><span class="font-semibold text-white text-sm" x-text="w.title"></span></template>
                <template x-if="editMode"><input x-model="w.title" class="text-sm font-semibold flex-1"></template>
                <div class="flex-1" x-show="!editMode"></div>
                <span class="pill badge-info" x-text="w.type"></span>
                <template x-if="editMode">
                  <div class="flex gap-1">
                    <button class="btn btn-ghost btn-sm" @click="moveWidget(idx,-1)" :disabled="idx===0">↑</button>
                    <button class="btn btn-ghost btn-sm" @click="moveWidget(idx,1)" :disabled="idx===activeDash.layout.length-1">↓</button>
                    <button class="btn btn-ghost btn-sm" @click="toggleWidth(w)" x-text="w.w===2?'½':'full'"></button>
                    <button class="btn btn-ghost btn-sm text-red-400" @click="removeWidget(idx)">✕</button>
                  </div>
                </template>
              </div>
              <!-- widget body -->
              <div :id="'wc-'+w.uid">
                <!-- match-based widgets render Plotly / declarative below via renderWidget -->
                <template x-if="['heatmap','network','pressing','players','training_chart'].includes(w.type)">
                  <div :id="'chart-'+w.uid" style="min-height:300px"></div>
                </template>

                <!-- KPI widget -->
                <template x-if="w.type==='kpi'">
                  <template x-if="teamData()">
                    <div class="grid grid-cols-4 gap-2">
                      <template x-for="c in teamData().summary.cards" :key="c.label">
                        <div class="stat-card">
                          <div class="text-lg" x-text="c.icon"></div>
                          <div class="text-xl font-bold text-white" x-text="c.value"></div>
                          <div class="text-[11px] text-gray-500" x-text="c.label"></div>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="!teamData()"><div class="text-sm text-gray-600 py-8 text-center">Load a match.</div></template>
                </template>

                <!-- Markdown / text widget -->
                <template x-if="w.type==='markdown'">
                  <div>
                    <template x-if="!editMode"><div class="text-sm text-gray-300 whitespace-pre-wrap" x-text="w.config.text||'Double-click Edit to add text.'"></div></template>
                    <template x-if="editMode"><textarea x-model="w.config.text" rows="4" class="w-full" placeholder="Write notes, context, reminders…"></textarea></template>
                  </div>
                </template>

                <!-- NOTE widget -->
                <template x-if="w.type==='note'">
                  <div>
                    <div class="space-y-2 mb-3 max-h-72 overflow-y-auto">
                      <template x-for="n in notesFor(w.config.scope)" :key="n.id">
                        <div class="bg-[#1e1e2a] border border-[#2a2a38] rounded-lg p-2.5">
                          <div class="flex items-start gap-2">
                            <div class="flex-1">
                              <div class="text-sm font-semibold text-white" x-text="n.title||'(untitled)'"></div>
                              <div class="text-xs text-gray-400 whitespace-pre-wrap mt-0.5" x-text="n.body"></div>
                              <div class="flex gap-1 mt-1 flex-wrap">
                                <template x-for="tg in (n.tags||[])" :key="tg"><span class="pill badge-info" x-text="tg"></span></template>
                                <span class="text-[10px] text-gray-600 ml-1" x-text="(n.created_at||'').slice(0,10)"></span>
                              </div>
                            </div>
                            <button class="text-gray-600 hover:text-red-400 text-xs" @click="deleteNote(n.id)">✕</button>
                          </div>
                        </div>
                      </template>
                      <template x-if="notesFor(w.config.scope).length===0"><div class="text-xs text-gray-600 py-3 text-center">No notes yet.</div></template>
                    </div>
                    <div class="flex gap-2">
                      <input x-model="noteDraft[w.uid+'_t']" placeholder="Title" class="w-32 text-xs">
                      <input x-model="noteDraft[w.uid+'_b']" placeholder="Suggestion / observation…" class="flex-1 text-xs" @keydown.enter="addNote(w)">
                      <button class="btn btn-primary btn-sm" @click="addNote(w)">Add</button>
                    </div>
                  </div>
                </template>

                <!-- SHORTLIST widget -->
                <template x-if="w.type==='shortlist'">
                  <div>
                    <div class="overflow-x-auto max-h-80 overflow-y-auto">
                      <table>
                        <thead><tr><th>Player</th><th>Pos</th><th>Status</th><th>Rating</th><th>Notes</th><th></th></tr></thead>
                        <tbody>
                          <template x-for="s in shortlist" :key="s.id">
                            <tr>
                              <td class="text-white font-medium" x-text="s.player_name"></td>
                              <td x-text="s.position||'–'"></td>
                              <td><select class="text-xs py-0.5" x-model="s.status" @change="updateShortlist(s)">
                                <option>watch</option><option>target</option><option>signed</option><option>rejected</option></select></td>
                              <td><span x-text="'★'.repeat(s.rating||0)+'☆'.repeat(5-(s.rating||0))" class="text-yellow-400 text-xs cursor-pointer" @click="cycleRating(s)"></span></td>
                              <td class="text-xs text-gray-400 max-w-[180px] truncate" x-text="s.notes"></td>
                              <td><button class="text-gray-600 hover:text-red-400 text-xs" @click="deleteShortlist(s.id)">✕</button></td>
                            </tr>
                          </template>
                          <template x-if="shortlist.length===0"><tr><td colspan="6" class="text-center text-gray-600 text-xs py-3">No players yet.</td></tr></template>
                        </tbody>
                      </table>
                    </div>
                    <div class="flex gap-2 mt-3 flex-wrap">
                      <input x-model="slDraft.player_name" placeholder="Player name" class="w-40 text-xs">
                      <input x-model="slDraft.position" placeholder="Pos" class="w-16 text-xs">
                      <input x-model="slDraft.notes" placeholder="Notes" class="flex-1 text-xs" @keydown.enter="addShortlist()">
                      <button class="btn btn-primary btn-sm" @click="addShortlist()">Add player</button>
                    </div>
                  </div>
                </template>

                <!-- network min-passes control -->
                <template x-if="w.type==='network'">
                  <div class="flex items-center gap-2 mt-2 text-xs text-gray-500">
                    <span>Min passes</span>
                    <input type="range" min="1" max="12" x-model.number="w.config.min_passes" @input="renderOneWidget(w)" class="w-24">
                    <span x-text="w.config.min_passes||3"></span>
                  </div>
                </template>

                <!-- training add control -->
                <template x-if="w.type==='training_chart'">
                  <div class="flex gap-2 mt-3 flex-wrap items-center">
                    <input type="date" x-model="trDraft.session_date" class="text-xs">
                    <input x-model="trDraft.focus" placeholder="Focus" class="w-32 text-xs">
                    <input type="number" x-model.number="trDraft.rpe" placeholder="RPE" min="1" max="10" class="w-16 text-xs">
                    <input type="number" x-model.number="trDraft.duration_min" placeholder="Min" class="w-16 text-xs">
                    <button class="btn btn-primary btn-sm" @click="addTraining()">Log session</button>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <template x-if="activeDash.layout.length===0">
          <div class="card p-10 text-center text-gray-500">
            Empty dashboard. <button class="btn btn-primary btn-sm ml-2" @click="editMode=true;openWidgetCatalog()">+ Add a widget</button>
          </div>
        </template>
      </div>
    </template>
  </main>
</div>

<!-- ════ Match picker modal ════ -->
<div class="modal-bg" x-show="showMatch" x-cloak @click.self="showMatch=false">
  <div class="card p-6 w-[640px] max-h-[85vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-white">Load a match</h2>
      <button class="text-gray-500 hover:text-white" @click="showMatch=false">✕</button>
    </div>

    <div class="card p-4 mb-3 border-[#dc143c44]">
      <div class="flex items-center gap-2 mb-2"><span class="text-xl">⚽</span><span class="font-semibold text-white text-sm">Real matches</span><span class="pill badge-pass">StatsBomb Open Data</span></div>
      <div class="grid grid-cols-2 gap-2">
        <select x-model="selectedComp" @change="loadMatches()" :disabled="compLoading" class="text-xs">
          <option value="" disabled selected x-text="compLoading?'Loading…':'Competition & season'"></option>
          <template x-for="c in competitions" :key="c.competition_id+'-'+c.season_id"><option :value="c.competition_id+':'+c.season_id" x-text="c.label"></option></template>
        </select>
        <select x-model="selectedMatch" @change="analyzeMatch()" :disabled="!matchList.length||matchLoading" class="text-xs">
          <option value="" disabled selected x-text="matchLoading?'Loading…':(matchList.length?'Pick a match':'Pick a competition first')"></option>
          <template x-for="m in matchList" :key="m.match_id"><option :value="m.match_id" x-text="m.label+'  ·  '+m.match_date"></option></template>
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="card p-4">
        <div class="text-2xl mb-1">⚡</div>
        <div class="font-semibold text-white text-sm mb-1">Demo match</div>
        <div class="text-xs text-gray-500 mb-3">Synthetic Man Utd vs Man City.</div>
        <button class="btn btn-primary btn-sm w-full justify-center" @click="loadSample()">Load demo</button>
      </div>
      <div class="card p-4">
        <div class="text-2xl mb-1">📂</div>
        <div class="font-semibold text-white text-sm mb-1">Upload JSON</div>
        <div class="drop-zone mt-1" @click="$refs.fi.click()" @dragover.prevent @drop.prevent="handleDrop($event)">
          <div class="text-xs text-gray-400">Drop a StatsBomb <strong class="text-white">.json</strong></div>
          <input type="file" accept=".json" x-ref="fi" class="hidden" @change="handleFile($event)">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ════ Template picker modal ════ -->
<div class="modal-bg" x-show="showTemplate" x-cloak @click.self="showTemplate=false">
  <div class="card p-6 w-[640px] max-h-[85vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-white">New dashboard</h2>
      <button class="text-gray-500 hover:text-white" @click="showTemplate=false">✕</button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <template x-for="t in templates" :key="t.key">
        <div class="card p-4 cursor-pointer hover:border-[#dc143c66]" @click="createFromTemplate(t)">
          <div class="text-2xl mb-1" x-text="t.icon"></div>
          <div class="font-semibold text-white text-sm" x-text="t.name"></div>
          <div class="text-xs text-gray-500 mt-1" x-text="t.description"></div>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- ════ Widget catalog modal ════ -->
<div class="modal-bg" x-show="showCatalog" x-cloak @click.self="showCatalog=false">
  <div class="card p-6 w-[560px] max-h-[85vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-white">Add a widget</h2>
      <button class="text-gray-500 hover:text-white" @click="showCatalog=false">✕</button>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <template x-for="wt in widgetCatalog" :key="wt.type">
        <div class="card p-3 cursor-pointer hover:border-[#dc143c66] flex gap-2 items-start" @click="addWidget(wt)">
          <span class="text-xl" x-text="wt.icon"></span>
          <div>
            <div class="font-semibold text-white text-sm" x-text="wt.label"></div>
            <div class="text-[11px] text-gray-500" x-text="wt.desc"></div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>

<script>
function bi(){
  return {
    // core state
    loading:false, loadingMsg:'Loading…', toast:'', toastErr:false,
    dbAvailable:false, dbBackend:'',
    templates:[], dashboards:[], activeDash:null, editMode:false,
    // match analytics
    matchData:null, activeTeam:'', matchLabel:'', matchCache:{},
    // shared DB data
    notes:[], training:[], shortlist:[],
    // drafts
    noteDraft:{}, slDraft:{player_name:'',position:'',notes:''}, trDraft:{session_date:new Date().toISOString().slice(0,10),focus:'',rpe:null,duration_min:null},
    // modals
    showMatch:false, showTemplate:false, showCatalog:false,
    // statsbomb browser
    competitions:[], compLoading:false, selectedComp:'', matchList:[], matchLoading:false, selectedMatch:'',

    widgetCatalog:[
      {type:'kpi',title:'Match KPIs',icon:'📊',label:'KPI cards',desc:'Key match metrics',w:2},
      {type:'heatmap',title:'Defensive Weakness',icon:'🗺️',label:'Weakness heatmap',desc:'Opponent vulnerable zones',w:1},
      {type:'network',title:'Pass Network',icon:'🔗',label:'Pass network',desc:'Player connections',w:1,config:{min_passes:3}},
      {type:'pressing',title:'Pressing',icon:'💪',label:'Pressing map',desc:'High-press sequences',w:1},
      {type:'players',title:'Progressive Passers',icon:'👤',label:'Player bar chart',desc:'Progressive passing',w:1},
      {type:'note',title:'Notes & Suggestions',icon:'📝',label:'Notes',desc:'Your recommendations',w:2,config:{scope:'general'}},
      {type:'shortlist',title:'Shortlist',icon:'🔎',label:'Recruitment shortlist',desc:'Scouting targets',w:2},
      {type:'training_chart',title:'Training Load',icon:'🏋️',label:'Training chart',desc:'RPE / load over time',w:2,config:{metric:'rpe'}},
      {type:'markdown',title:'Text note',icon:'📄',label:'Text block',desc:'Free-form notes',w:1,config:{text:''}},
    ],

    async init(){
      const st = await this.apiGet('/api/db-status').catch(()=>({available:false}));
      this.dbAvailable=st.available; this.dbBackend=st.backend||'';
      const tp = await this.apiGet('/api/templates').catch(()=>({templates:[]}));
      this.templates=tp.templates;
      await this.refreshAll();            // works with DB or browser storage
      this.loadCompetitions();
    },

    // ── storage abstraction: Postgres API when available, else this browser ──
    storageLabel(){ return this.dbAvailable ? ('DB: '+this.dbBackend) : 'Saved in browser'; },
    localKey(c){ return 'redpipe_'+c; },
    localGet(c){ try{ return JSON.parse(localStorage.getItem(this.localKey(c))||'[]'); }catch(e){ return []; } },
    localSet(c,a){ localStorage.setItem(this.localKey(c),JSON.stringify(a)); },
    localCreate(c,o){ const a=this.localGet(c); const id=a.reduce((m,x)=>Math.max(m,x.id||0),0)+1; const row={...o,id,created_at:new Date().toISOString(),updated_at:new Date().toISOString()}; a.unshift(row); this.localSet(c,a); return row; },
    localUpdate(c,id,p){ const a=this.localGet(c); const i=a.findIndex(x=>x.id===id); if(i>=0){ a[i]={...a[i],...p,updated_at:new Date().toISOString()}; this.localSet(c,a); return a[i]; } return null; },
    localDelete(c,id){ this.localSet(c,this.localGet(c).filter(x=>x.id!==id)); return {deleted:true}; },

    async dataList(c){ if(this.dbAvailable){ const d=await this.apiGet('/api/'+c); return d[c]; } return this.localGet(c); },
    async dataCreate(c,o){ return this.dbAvailable ? this.apiSend('/api/'+c,'POST',o) : this.localCreate(c,o); },
    async dataUpdate(c,id,o){ return this.dbAvailable ? this.apiSend('/api/'+c+'/'+id,'PUT',o) : this.localUpdate(c,id,o); },
    async dataDelete(c,id){ return this.dbAvailable ? this.apiSend('/api/'+c+'/'+id,'DELETE',{}) : this.localDelete(c,id); },

    // ── helpers ──
    uid(){ return (crypto.randomUUID?crypto.randomUUID():'w'+Math.random().toString(36).slice(2)); },
    contextIcon(c){ return {match:'📋',recruitment:'🔎',training:'🏋️',squad:'👥',custom:'🧩'}[c]||'🧩'; },
    notify(msg,err=false){ this.toast=msg; this.toastErr=err; setTimeout(()=>this.toast='',3000); },
    async apiGet(u){ const r=await fetch(u); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||r.status); return r.json(); },
    async apiSend(u,m,b){ const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||r.status); return r.json(); },

    async refreshAll(){
      const [d,n,t,s]=await Promise.all([
        this.dataList('dashboards').catch(()=>[]),
        this.dataList('notes').catch(()=>[]),
        this.dataList('training').catch(()=>[]),
        this.dataList('shortlist').catch(()=>[]),
      ]);
      this.dashboards=d; this.notes=n; this.training=t; this.shortlist=s;
    },

    teamData(){ return (this.matchData&&this.activeTeam)?this.matchData.by_team[this.activeTeam]:null; },
    notesFor(scope){ return this.notes.filter(n=>!scope||scope==='general'?true:n.scope===scope); },
    dashNeedsMatch(){ return this.activeDash && this.activeDash.layout.some(w=>['kpi','heatmap','network','pressing','players'].includes(w.type)); },

    // ── dashboards ──
    openTemplatePicker(){ this.showTemplate=true; },
    async createFromTemplate(t){
      this.showTemplate=false;
      const layout=(t.layout||[]).map(w=>({...w,uid:this.uid(),config:w.config?{...w.config}:{}}));
      try{
        const d=await this.dataCreate('dashboards',{name:t.name,context:t.context,layout});
        this.dashboards.unshift(d); this.openDashboard(d); this.notify('Dashboard created');
      }catch(e){ this.notify(e.message,true); }
    },
    openDashboard(d){
      // deep clone so edits are local until saved
      this.activeDash=JSON.parse(JSON.stringify(d));
      this.activeDash.layout=(this.activeDash.layout||[]).map(w=>({...w,uid:w.uid||this.uid(),config:w.config||{}}));
      this.editMode=false;
      this.$nextTick(()=>this.renderDashboardCharts());
    },
    async saveDashboard(){
      try{
        const body={name:this.activeDash.name,context:this.activeDash.context,layout:this.activeDash.layout};
        if(this.activeDash.id){
          const d=await this.dataUpdate('dashboards',this.activeDash.id,body);
          const i=this.dashboards.findIndex(x=>x.id===this.activeDash.id); if(i>=0&&d) this.dashboards[i]=d;
        }else{
          const d=await this.dataCreate('dashboards',body);
          this.activeDash.id=d.id; this.dashboards.unshift(d);
        }
        this.editMode=false; this.notify('Saved'); this.$nextTick(()=>this.renderDashboardCharts());
      }catch(e){ this.notify(e.message,true); }
    },
    async deleteDashboard(){
      if(!confirm('Delete this dashboard?')) return;
      if(this.activeDash.id){ try{ await this.dataDelete('dashboards',this.activeDash.id); }catch(e){} }
      this.dashboards=this.dashboards.filter(d=>d.id!==this.activeDash.id);
      this.activeDash=null; this.editMode=false;
    },

    // ── widgets ──
    openWidgetCatalog(){ this.showCatalog=true; },
    addWidget(wt){
      this.showCatalog=false;
      this.activeDash.layout.push({type:wt.type,title:wt.title,w:wt.w||1,uid:this.uid(),config:wt.config?{...wt.config}:{}});
      this.$nextTick(()=>this.renderDashboardCharts());
    },
    removeWidget(i){ this.activeDash.layout.splice(i,1); },
    moveWidget(i,dir){ const j=i+dir; if(j<0||j>=this.activeDash.layout.length) return; const a=this.activeDash.layout; [a[i],a[j]]=[a[j],a[i]]; this.$nextTick(()=>this.renderDashboardCharts()); },
    toggleWidth(w){ w.w=w.w===2?1:2; this.$nextTick(()=>this.renderDashboardCharts()); },

    // ── match data ──
    openMatchPicker(){ this.showMatch=true; if(!this.competitions.length) this.loadCompetitions(); },
    async loadCompetitions(){ this.compLoading=true; try{ const d=await this.apiGet('/api/competitions'); this.competitions=d.competitions; }catch(e){} finally{ this.compLoading=false; } },
    async loadMatches(){ if(!this.selectedComp) return; const[c,s]=this.selectedComp.split(':'); this.matchLoading=true; this.matchList=[]; this.selectedMatch=''; try{ const d=await this.apiGet(`/api/matches?competition_id=${c}&season_id=${s}`); this.matchList=d.matches; }catch(e){ this.notify(e.message,true); } finally{ this.matchLoading=false; } },
    async analyzeMatch(){ if(!this.selectedMatch) return; const m=this.matchList.find(x=>x.match_id==this.selectedMatch); await this.loadMatch('/api/analyze/'+this.selectedMatch, m?m.label:('Match '+this.selectedMatch)); },
    async loadSample(){ await this.loadMatch('/api/sample','Demo: Man Utd vs Man City'); },
    async handleFile(e){ const f=e.target.files[0]; if(f) await this.uploadFile(f); },
    async handleDrop(e){ const f=e.dataTransfer.files[0]; if(f) await this.uploadFile(f); },
    async uploadFile(file){ if(!file.name.endsWith('.json')){ this.notify('Need a .json file',true); return;} const fd=new FormData(); fd.append('file',file); this.loadingMsg='Processing upload…'; this.loading=true; try{ const r=await fetch('/api/upload',{method:'POST',body:fd}); if(!r.ok) throw new Error((await r.json()).detail); this.setMatch(await r.json(),file.name); }catch(e){ this.notify(e.message,true);} finally{ this.loading=false; } },
    async loadMatch(url,label){
      this.loadingMsg='Fetching match & running analytics…'; this.loading=true;
      try{
        let data = this.matchCache[url];
        if(!data){ data=await this.apiGet(url); this.matchCache[url]=data; }
        this.setMatch(data,label);
      }catch(e){ this.notify(e.message,true); } finally{ this.loading=false; }
    },
    setMatch(data,label){
      this.matchData=data; this.activeTeam=data.teams[0]||''; this.matchLabel=label;
      this.showMatch=false; this.notify('Match loaded'); this.$nextTick(()=>this.renderDashboardCharts());
    },

    // ── notes ──
    async addNote(w){
      const t=this.noteDraft[w.uid+'_t']||''; const b=this.noteDraft[w.uid+'_b']||'';
      if(!b.trim()){ return; }
      try{ const n=await this.dataCreate('notes',{scope:w.config.scope||'general',title:t,body:b,ref_id:this.matchData?this.matchData.match_id:null,ref_label:this.matchLabel,tags:[]});
        this.notes.unshift(n); this.noteDraft[w.uid+'_t']=''; this.noteDraft[w.uid+'_b']=''; }
      catch(e){ this.notify(e.message,true); }
    },
    async deleteNote(id){ try{ await this.dataDelete('notes',id); this.notes=this.notes.filter(n=>n.id!==id);}catch(e){ this.notify(e.message,true);} },

    // ── shortlist ──
    async addShortlist(){ if(!this.slDraft.player_name.trim()) return; try{ const s=await this.dataCreate('shortlist',{player_name:this.slDraft.player_name,position:this.slDraft.position,notes:this.slDraft.notes,status:'watch',rating:3,tags:[]}); this.shortlist.unshift(s); this.slDraft={player_name:'',position:'',notes:''}; }catch(e){ this.notify(e.message,true);} },
    async updateShortlist(s){ try{ await this.dataUpdate('shortlist',s.id,{status:s.status,rating:s.rating,notes:s.notes}); }catch(e){ this.notify(e.message,true);} },
    cycleRating(s){ s.rating=((s.rating||0)%5)+1; this.updateShortlist(s); },
    async deleteShortlist(id){ try{ await this.dataDelete('shortlist',id); this.shortlist=this.shortlist.filter(s=>s.id!==id);}catch(e){ this.notify(e.message,true);} },

    // ── training ──
    async addTraining(){ if(!this.trDraft.session_date) return; try{ const t=await this.dataCreate('training',{session_date:this.trDraft.session_date,focus:this.trDraft.focus,rpe:this.trDraft.rpe,duration_min:this.trDraft.duration_min,metrics:{}}); this.training.push(t); this.training.sort((a,b)=>a.session_date.localeCompare(b.session_date)); this.trDraft={session_date:new Date().toISOString().slice(0,10),focus:'',rpe:null,duration_min:null}; this.$nextTick(()=>this.renderDashboardCharts()); }catch(e){ this.notify(e.message,true);} },

    // ── chart rendering ──
    renderDashboardCharts(){ if(!this.activeDash) return; this.activeDash.layout.forEach(w=>this.renderOneWidget(w)); },
    renderOneWidget(w){
      const el=document.getElementById('chart-'+w.uid); if(!el) return;
      if(w.type==='training_chart'){ this.renderTraining(el); return; }
      const td=this.teamData(); if(!td){ el.innerHTML='<div class="text-sm text-gray-600 py-10 text-center">Load a match to populate.</div>'; return; }
      if(w.type==='heatmap') this.renderHeatmap(el,td);
      if(w.type==='network') this.renderNetwork(el,td,w.config.min_passes||3);
      if(w.type==='pressing') this.renderPressing(el,td);
      if(w.type==='players') this.renderPlayers(el,td);
    },
    pitchShapes(){const lc='rgba(255,255,255,.22)',lw=1.5;return[{type:'rect',x0:0,y0:0,x1:120,y1:80,line:{color:lc,width:lw},fillcolor:'rgba(20,80,20,.2)'},{type:'line',x0:60,y0:0,x1:60,y1:80,line:{color:lc,width:lw}},{type:'circle',x0:50,y0:30,x1:70,y1:50,line:{color:lc,width:lw}},{type:'rect',x0:0,y0:18,x1:18,y1:62,line:{color:lc,width:lw},fillcolor:'rgba(0,0,0,0)'},{type:'rect',x0:102,y0:18,x1:120,y1:62,line:{color:lc,width:lw},fillcolor:'rgba(0,0,0,0)'}];},
    pitchLayout(ex={}){return{paper_bgcolor:'#1a1a24',plot_bgcolor:'#1a1a24',font:{color:'#9ca3af',family:'Inter'},xaxis:{range:[0,120],showgrid:false,zeroline:false,visible:false},yaxis:{range:[0,80],showgrid:false,zeroline:false,visible:false,scaleanchor:'x',scaleratio:1},shapes:this.pitchShapes(),margin:{t:10,b:10,l:10,r:10},...ex};},
    baseLayout(ex={}){return{paper_bgcolor:'#1a1a24',plot_bgcolor:'#1a1a24',font:{color:'#9ca3af',family:'Inter'},xaxis:{color:'#6b7280',gridcolor:'#2a2a38'},yaxis:{color:'#6b7280',gridcolor:'#2a2a38'},margin:{t:10,b:60,l:40,r:10},...ex};},
    renderHeatmap(el,td){
      const pts=td.heatmap.points,f=pts.filter(p=>p.type==='Defensive failure'),pr=pts.filter(p=>p.type!=='Defensive failure'),tr=[];
      if(pts.length>5) tr.push({x:pts.map(p=>p.x),y:pts.map(p=>p.y),type:'histogram2dcontour',colorscale:[['0','rgba(220,20,60,0)'],['1','rgba(220,20,60,.4)']],showscale:false,ncontours:12,contours:{coloring:'fill'},line:{width:0},hoverinfo:'skip'});
      if(f.length) tr.push({x:f.map(p=>p.x),y:f.map(p=>p.y),mode:'markers',type:'scatter',marker:{color:'#f97316',opacity:.6,size:6},name:'Def. failure'});
      if(pr.length) tr.push({x:pr.map(p=>p.x),y:pr.map(p=>p.y),mode:'markers',type:'scatter',marker:{color:'#60a5fa',opacity:.6,size:6},name:'Prog. pass'});
      Plotly.react(el,tr,this.pitchLayout({showlegend:false}),{responsive:true,displayModeBar:false});
    },
    renderNetwork(el,td,mp){
      const {nodes,edges}=td.network,fe=edges.filter(e=>e.weight>=mp);
      if(!nodes.length){el.innerHTML='<div class="text-gray-600 text-sm py-10 text-center">No pass data.</div>';return;}
      const maxB=Math.max(...nodes.map(n=>n.betweenness),.001),maxP=Math.max(...nodes.map(n=>n.passes_made),1);
      const et=fe.map(e=>{const a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to);if(!a||!b)return null;return{x:[a.x,b.x,null],y:[a.y,b.y,null],mode:'lines',type:'scatter',line:{color:`rgba(200,200,200,${Math.min(.1+e.weight/30,.5)})`,width:Math.max(.5,e.weight/4)},hoverinfo:'skip'};}).filter(Boolean);
      const nt={x:nodes.map(n=>n.x),y:nodes.map(n=>n.y),mode:'markers+text',type:'scatter',text:nodes.map(n=>n.name.split(' ').pop()),textfont:{color:'#e5e7eb',size:9},textposition:'top center',hovertemplate:nodes.map(n=>`<b>${n.name}</b><br>Made:${n.passes_made} Recv:${n.passes_received}<br>Influence:${n.betweenness}<extra></extra>`),marker:{size:nodes.map(n=>9+n.passes_made/maxP*26),color:nodes.map(n=>n.betweenness/maxB),colorscale:'RdYlBu_r',cmin:0,cmax:1,line:{width:1.4,color:'#fff'}}};
      Plotly.react(el,[...et,nt],this.pitchLayout({showlegend:false}),{responsive:true,displayModeBar:false});
    },
    renderPressing(el,td){
      const s=td.pressing.sequences;
      if(!s.length){el.innerHTML='<div class="text-gray-600 text-sm py-10 text-center">No pressing sequences.</div>';return;}
      Plotly.react(el,[{x:s.map(d=>d.x),y:s.map(d=>d.y),mode:'markers',type:'scatter',marker:{size:s.map(d=>d.actions*7),color:s.map(d=>d.actions),colorscale:'Reds',cmin:3,opacity:.85,line:{width:1.4,color:'#fff'}},hovertemplate:s.map(d=>`Seq ${d.id}<br>${d.minute}:${String(d.second).padStart(2,'0')}<br>Actions:${d.actions}<extra></extra>`)}],this.pitchLayout(),{responsive:true,displayModeBar:false});
    },
    renderPlayers(el,td){
      const ps=[...td.players.players].sort((a,b)=>b.progressive_passes-a.progressive_passes).slice(0,12),avg=td.players.league_avg_progressive;
      Plotly.react(el,[{x:ps.map(p=>p.name.split(' ').pop()),y:ps.map(p=>p.progressive_passes),type:'bar',marker:{color:ps.map(p=>p.progressive_passes>=avg?'#dc143c':'#4b5563')},hovertemplate:ps.map(p=>`<b>${p.name}</b><br>Prog:${p.progressive_passes}<br>Compl:${p.completion_pct}%<extra></extra>`)}],this.baseLayout({xaxis:{tickangle:-30,color:'#6b7280',gridcolor:'#2a2a38'},yaxis:{title:'Progressive',color:'#6b7280',gridcolor:'#2a2a38'},shapes:[{type:'line',x0:-.5,y0:avg,x1:ps.length-.5,y1:avg,line:{color:'#fbbf24',width:2,dash:'dot'}}]}),{responsive:true,displayModeBar:false});
    },
    renderTraining(el){
      if(!this.training.length){el.innerHTML='<div class="text-gray-600 text-sm py-10 text-center">No training sessions logged yet.</div>';return;}
      const t=[...this.training].sort((a,b)=>a.session_date.localeCompare(b.session_date));
      Plotly.react(el,[
        {x:t.map(s=>s.session_date),y:t.map(s=>s.rpe),type:'bar',name:'RPE',marker:{color:'#dc143c'},yaxis:'y'},
        {x:t.map(s=>s.session_date),y:t.map(s=>s.duration_min),type:'scatter',mode:'lines+markers',name:'Duration (min)',line:{color:'#fbbf24'},yaxis:'y2'}
      ],this.baseLayout({margin:{t:10,b:50,l:40,r:40},legend:{font:{size:10},orientation:'h'},yaxis:{title:'RPE',color:'#6b7280',gridcolor:'#2a2a38',range:[0,10]},yaxis2:{title:'Min',overlaying:'y',side:'right',color:'#6b7280'},xaxis:{color:'#6b7280',gridcolor:'#2a2a38'}}),{responsive:true,displayModeBar:false});
    },
  };
}
</script>
</body>
</html>
