<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedPipeline · Football Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='3' y='3' width='42' height='42' rx='11' fill='%23dc143c'/%3E%3Cg stroke='%23fff' stroke-width='2.2' opacity='.6'%3E%3Cline x1='14' y1='33' x2='24' y2='14'/%3E%3Cline x1='24' y1='14' x2='34' y2='33'/%3E%3Cline x1='14' y1='33' x2='34' y2='33'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Ccircle cx='14' cy='33' r='3.4'/%3E%3Ccircle cx='24' cy='14' r='3.4'/%3E%3Ccircle cx='34' cy='33' r='3.4'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak]{display:none!important}
    :root{--bg:#0c0c11;--panel:#15151d;--panel2:#1b1b25;--line:#272733;--line2:#33333f;--red:#dc143c;--red-dim:#dc143c22;--muted:#8b8b99}
    *{box-sizing:border-box}
    body{background:var(--bg);color:#e7e7ee;font-family:'Inter',system-ui,sans-serif;letter-spacing:-.01em}
    .icon{display:inline-block;vertical-align:middle;flex:none}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
    .btn{padding:.5rem .9rem;border-radius:9px;font-weight:600;font-size:.82rem;cursor:pointer;border:1px solid transparent;transition:.15s;display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap}
    .btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#bd1133}
    .btn-ghost{background:transparent;color:#b3b3c0;border-color:var(--line2)}.btn-ghost:hover{background:#23232e;color:#fff}
    .btn-sm{padding:.34rem .6rem;font-size:.74rem;border-radius:7px}
    .btn-icon{padding:.34rem;border-radius:7px}
    .nav-item{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:9px;cursor:pointer;font-size:.86rem;transition:.15s;color:#a7a7b4;font-weight:500}
    .nav-item:hover{background:#23232e;color:#fff}
    .nav-item.active{background:var(--red-dim);color:#ff6b85}
    .nav-item.active .icon{color:#ff6b85}
    .stat-card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:.85rem 1rem}
    .pill{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .55rem;border-radius:999px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .badge-pass{background:#16a34a1f;color:#4ade80}
    .badge-fail{background:#dc143c1f;color:#f87171}
    .badge-info{background:#3b82f61f;color:#7eb0ff}
    .badge-muted{background:#ffffff0d;color:#9a9aa8}
    .loader{border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;width:34px;height:34px;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    table{width:100%;border-collapse:collapse;font-size:.83rem}
    th{padding:.55rem .7rem;text-align:left;color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
    td{padding:.55rem .7rem;border-bottom:1px solid #1d1d27}
    tr:hover td{background:var(--panel2)}
    select,input,textarea{background:var(--panel2);border:1px solid var(--line2);color:#e7e7ee;padding:.42rem .7rem;border-radius:8px;font-size:.84rem;font-family:inherit}
    select:focus,input:focus,textarea:focus{outline:none;border-color:#dc143c88}
    input::placeholder,textarea::placeholder{color:#6b6b78}
    input[type=range]{accent-color:var(--red);padding:0}
    .modal-bg{position:fixed;inset:0;background:rgba(5,5,9,.72);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
    .grid-dash{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .span-2{grid-column:1 / -1}
    .drop-zone{border:1.5px dashed var(--line2);border-radius:10px;padding:1.3rem;text-align:center;cursor:pointer;transition:.2s}
    .drop-zone:hover{border-color:var(--red);background:#dc143c0a}
    .topbar{background:linear-gradient(180deg,#15151d,#121219);border-bottom:1px solid var(--line)}
    ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  </style>
</head>
<body x-data="bi()" x-init="init()" x-cloak>

<!-- Toast -->
<div x-show="toast" x-transition class="fixed top-4 right-4 z-[60] px-4 py-3 rounded-xl shadow-2xl max-w-sm text-sm flex items-start gap-2.5 border"
     :class="toastErr ? 'bg-[#2a1115] border-red-800 text-red-200' : 'bg-[#0f2417] border-green-800 text-green-200'">
  <span x-html="icon(toastErr?'alert':'check',17)" class="mt-px"></span><span x-text="toast" class="flex-1"></span>
  <button @click="toast=''" class="opacity-60 hover:opacity-100" x-html="icon('x',15)"></button>
</div>

<!-- Loader -->
<div x-show="loading" class="fixed inset-0 bg-black/65 z-[55] flex flex-col items-center justify-center gap-5">
  <div x-html="logoMark(46)"></div>
  <div class="loader"></div>
  <div class="text-gray-300 text-sm" x-text="loadingMsg"></div>
</div>

<div class="flex h-screen overflow-hidden">

  <!-- ════ Sidebar ════ -->
  <aside class="w-60 flex-shrink-0 flex flex-col border-r border-[#272733] bg-[#101017]">
    <div class="px-4 py-4 border-b border-[#272733] flex items-center gap-2.5">
      <span x-html="logoMark(34)"></span>
      <div>
        <div class="font-extrabold text-white text-[15px] leading-none tracking-tight">RedPipeline</div>
        <div class="text-[9.5px] text-gray-500 uppercase tracking-[.18em] mt-1">Football Intelligence</div>
      </div>
    </div>

    <div class="p-3 flex-1 overflow-y-auto">
      <div class="flex items-center justify-between mb-2 px-1">
        <span class="text-[11px] text-gray-500 uppercase tracking-wider font-semibold">Dashboards</span>
        <button class="btn btn-ghost btn-sm" @click="openTemplatePicker()"><span x-html="icon('plus',13)"></span>New</button>
      </div>

      <div class="space-y-0.5">
        <template x-for="d in dashboards" :key="d.id">
          <div class="nav-item" :class="{active: activeDash && activeDash.id===d.id}" @click="openDashboard(d)">
            <span x-html="icon(contextIcon(d.context),16)"></span>
            <span class="flex-1 truncate" x-text="d.name"></span>
          </div>
        </template>
        <template x-if="dashboards.length===0">
          <div class="text-xs text-gray-600 px-1 py-2 leading-relaxed">No dashboards yet. Click <strong class="text-gray-400">New</strong> to create one.</div>
        </template>
      </div>
    </div>

    <div class="p-3 border-t border-[#272733]">
      <div class="text-[10px] text-gray-500 uppercase tracking-wider mb-1.5">Active match</div>
      <template x-if="matchData">
        <div>
          <div class="text-[13px] text-white font-medium truncate leading-tight" x-text="matchLabel"></div>
          <select x-show="matchData.teams.length>1" x-model="activeTeam" @change="renderDashboardCharts()" class="w-full mt-1.5 text-xs">
            <template x-for="t in matchData.teams" :key="t"><option :value="t" x-text="t"></option></template>
          </select>
        </div>
      </template>
      <template x-if="!matchData"><div class="text-xs text-gray-600">None loaded</div></template>
      <button class="btn btn-ghost btn-sm w-full mt-2 justify-center" @click="openMatchPicker()"><span x-html="icon('target',14)"></span>Change match</button>
    </div>

    <div class="px-3 py-2.5 border-t border-[#272733] flex items-center">
      <span class="pill" :class="dbAvailable ? 'badge-pass' : 'badge-info'"><span x-html="icon('database',11)"></span><span x-text="storageLabel()"></span></span>
    </div>
  </aside>

  <!-- ════ Main ════ -->
  <main class="flex-1 overflow-y-auto">

    <!-- Empty state -->
    <template x-if="!activeDash">
      <div class="max-w-3xl mx-auto px-8 py-12">
        <div class="flex items-center gap-3 mb-2">
          <span x-html="logoMark(40)"></span>
          <h1 class="text-[28px] font-extrabold text-white tracking-tight">Football Intelligence workspace</h1>
        </div>
        <p class="text-gray-400 mb-8 ml-[52px] -mt-1">Build dashboards from a template or from scratch, load real match data, and capture the decisions that follow — all saved for next time.</p>
        <div class="grid grid-cols-2 gap-3">
          <template x-for="t in templates" :key="t.key">
            <div class="card p-5 cursor-pointer hover:border-[#dc143c66] transition group" @click="createFromTemplate(t)">
              <div class="w-10 h-10 rounded-lg bg-[#dc143c1a] text-[#ff6b85] flex items-center justify-center mb-3 group-hover:bg-[#dc143c2a] transition" x-html="icon(t.icon,20)"></div>
              <div class="font-bold text-white" x-text="t.name"></div>
              <div class="text-xs text-gray-500 mt-1 leading-relaxed" x-text="t.description"></div>
            </div>
          </template>
        </div>
        <div class="mt-6">
          <button class="btn btn-ghost" @click="openMatchPicker()"><span x-html="icon('target',16)"></span>Load a match to analyse</button>
        </div>
      </div>
    </template>

    <!-- Dashboard view -->
    <template x-if="activeDash">
      <div>
        <!-- Top bar -->
        <div class="topbar sticky top-0 z-20 px-5 py-3 flex items-center gap-3">
          <span x-html="icon(contextIcon(activeDash.context),20)" class="text-[#ff6b85]"></span>
          <template x-if="!editMode"><h1 class="text-lg font-bold text-white tracking-tight" x-text="activeDash.name"></h1></template>
          <template x-if="editMode"><input x-model="activeDash.name" class="text-base font-bold w-72"></template>
          <div class="flex-1"></div>
          <template x-if="!editMode">
            <button class="btn btn-ghost btn-sm" @click="editMode=true"><span x-html="icon('edit',14)"></span>Edit</button>
          </template>
          <template x-if="editMode">
            <div class="flex gap-2">
              <button class="btn btn-ghost btn-sm" @click="openWidgetCatalog()"><span x-html="icon('plus',14)"></span>Widget</button>
              <button class="btn btn-primary btn-sm" @click="saveDashboard()"><span x-html="icon('save',14)"></span>Save</button>
              <button class="btn btn-ghost btn-sm" @click="editMode=false;openDashboard(activeDash)">Done</button>
              <button class="btn btn-ghost btn-sm btn-icon text-red-400" @click="deleteDashboard()" x-html="icon('trash',14)"></button>
            </div>
          </template>
        </div>

        <div class="p-5">
          <!-- Match-needed notice -->
          <template x-if="dashNeedsMatch() && !matchData">
            <div class="card p-4 mb-4 flex items-center gap-3 border-[#33333f]">
              <span class="w-9 h-9 rounded-lg bg-[#dc143c1a] text-[#ff6b85] flex items-center justify-center" x-html="icon('target',18)"></span>
              <div class="flex-1 text-sm text-gray-300">This dashboard has match widgets. Load a match to populate them.</div>
              <button class="btn btn-primary btn-sm" @click="openMatchPicker()">Load match</button>
            </div>
          </template>

          <!-- Widget grid -->
          <div class="grid-dash">
            <template x-for="(w,idx) in activeDash.layout" :key="w.uid">
              <div class="card p-4" :class="{'span-2': w.w===2}">
                <div class="flex items-center gap-2 mb-3">
                  <span class="text-gray-500" x-html="icon(widgetIcon(w.type),15)"></span>
                  <template x-if="!editMode"><span class="font-semibold text-white text-sm" x-text="w.title"></span></template>
                  <template x-if="editMode"><input x-model="w.title" class="text-sm font-semibold flex-1 py-1"></template>
                  <div class="flex-1" x-show="!editMode"></div>
                  <template x-if="editMode">
                    <div class="flex gap-1">
                      <button class="btn btn-ghost btn-icon" @click="moveWidget(idx,-1)" :disabled="idx===0" x-html="icon('up',13)"></button>
                      <button class="btn btn-ghost btn-icon" @click="moveWidget(idx,1)" :disabled="idx===activeDash.layout.length-1" x-html="icon('down',13)"></button>
                      <button class="btn btn-ghost btn-icon" @click="toggleWidth(w)" x-html="icon(w.w===2?'collapse':'expand',13)"></button>
                      <button class="btn btn-ghost btn-icon text-red-400" @click="removeWidget(idx)" x-html="icon('x',13)"></button>
                    </div>
                  </template>
                </div>

                <div :id="'wc-'+w.uid">
                  <template x-if="['heatmap','network','pressing','players','training_chart'].includes(w.type)">
                    <div :id="'chart-'+w.uid" style="min-height:300px"></div>
                  </template>

                  <!-- KPI -->
                  <template x-if="w.type==='kpi'">
                    <template x-if="teamData()">
                      <div class="grid grid-cols-4 gap-2">
                        <template x-for="c in teamData().summary.cards" :key="c.label">
                          <div class="stat-card">
                            <div class="text-[22px] font-bold text-white leading-none" x-text="c.value"></div>
                            <div class="text-[11px] text-gray-500 mt-1.5" x-text="c.label"></div>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!teamData()"><div class="text-sm text-gray-600 py-8 text-center">Load a match.</div></template>
                  </template>

                  <!-- markdown -->
                  <template x-if="w.type==='markdown'">
                    <div>
                      <template x-if="!editMode"><div class="text-sm text-gray-300 whitespace-pre-wrap leading-relaxed" x-text="w.config.text||'Switch to Edit to add text.'"></div></template>
                      <template x-if="editMode"><textarea x-model="w.config.text" rows="4" class="w-full" placeholder="Write notes, context, reminders…"></textarea></template>
                    </div>
                  </template>

                  <!-- note -->
                  <template x-if="w.type==='note'">
                    <div>
                      <div class="space-y-2 mb-3 max-h-72 overflow-y-auto">
                        <template x-for="n in notesFor(w.config.scope)" :key="n.id">
                          <div class="bg-[#1b1b25] border border-[#272733] rounded-lg p-2.5">
                            <div class="flex items-start gap-2">
                              <div class="flex-1">
                                <div class="text-sm font-semibold text-white" x-text="n.title||'(untitled)'"></div>
                                <div class="text-xs text-gray-400 whitespace-pre-wrap mt-0.5 leading-relaxed" x-text="n.body"></div>
                                <div class="text-[10px] text-gray-600 mt-1" x-text="(n.created_at||'').slice(0,10)"></div>
                              </div>
                              <button class="text-gray-600 hover:text-red-400" @click="deleteNote(n.id)" x-html="icon('x',13)"></button>
                            </div>
                          </div>
                        </template>
                        <template x-if="notesFor(w.config.scope).length===0"><div class="text-xs text-gray-600 py-3 text-center">No notes yet.</div></template>
                      </div>
                      <div class="flex gap-2">
                        <input x-model="noteDraft[w.uid+'_t']" placeholder="Title" class="w-32 text-xs">
                        <input x-model="noteDraft[w.uid+'_b']" placeholder="Suggestion / observation…" class="flex-1 text-xs" @keydown.enter="addNote(w)">
                        <button class="btn btn-primary btn-sm" @click="addNote(w)">Add</button>
                      </div>
                    </div>
                  </template>

                  <!-- shortlist -->
                  <template x-if="w.type==='shortlist'">
                    <div>
                      <div class="overflow-x-auto max-h-80 overflow-y-auto">
                        <table>
                          <thead><tr><th>Player</th><th>Pos</th><th>Status</th><th>Rating</th><th>Notes</th><th></th></tr></thead>
                          <tbody>
                            <template x-for="s in shortlist" :key="s.id">
                              <tr>
                                <td class="text-white font-medium" x-text="s.player_name"></td>
                                <td x-text="s.position||'–'"></td>
                                <td><select class="text-xs py-0.5" x-model="s.status" @change="updateShortlist(s)"><option>watch</option><option>target</option><option>signed</option><option>rejected</option></select></td>
                                <td><span class="text-yellow-400 text-xs cursor-pointer select-none" @click="cycleRating(s)" x-text="'★'.repeat(s.rating||0)+'☆'.repeat(5-(s.rating||0))"></span></td>
                                <td class="text-xs text-gray-400 max-w-[180px] truncate" x-text="s.notes"></td>
                                <td><button class="text-gray-600 hover:text-red-400" @click="deleteShortlist(s.id)" x-html="icon('x',13)"></button></td>
                              </tr>
                            </template>
                            <template x-if="shortlist.length===0"><tr><td colspan="6" class="text-center text-gray-600 text-xs py-3">No players yet.</td></tr></template>
                          </tbody>
                        </table>
                      </div>
                      <div class="flex gap-2 mt-3 flex-wrap">
                        <input x-model="slDraft.player_name" placeholder="Player name" class="w-40 text-xs">
                        <input x-model="slDraft.position" placeholder="Pos" class="w-16 text-xs">
                        <input x-model="slDraft.notes" placeholder="Notes" class="flex-1 text-xs" @keydown.enter="addShortlist()">
                        <button class="btn btn-primary btn-sm" @click="addShortlist()">Add player</button>
                      </div>
                    </div>
                  </template>

                  <!-- network control -->
                  <template x-if="w.type==='network'">
                    <div class="flex items-center gap-2 mt-2 text-xs text-gray-500">
                      <span>Min passes</span>
                      <input type="range" min="1" max="12" x-model.number="w.config.min_passes" @input="renderOneWidget(w)" class="w-24">
                      <span class="text-gray-300" x-text="w.config.min_passes||3"></span>
                    </div>
                  </template>

                  <!-- training control -->
                  <template x-if="w.type==='training_chart'">
                    <div class="flex gap-2 mt-3 flex-wrap items-center">
                      <input type="date" x-model="trDraft.session_date" class="text-xs">
                      <input x-model="trDraft.focus" placeholder="Focus" class="w-32 text-xs">
                      <input type="number" x-model.number="trDraft.rpe" placeholder="RPE" min="1" max="10" class="w-16 text-xs">
                      <input type="number" x-model.number="trDraft.duration_min" placeholder="Min" class="w-16 text-xs">
                      <button class="btn btn-primary btn-sm" @click="addTraining()">Log session</button>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <template x-if="activeDash.layout.length===0">
            <div class="card p-12 text-center text-gray-500">
              <div class="flex justify-center mb-3 text-gray-700" x-html="icon('grid',32)"></div>
              Empty dashboard.
              <button class="btn btn-primary btn-sm ml-2" @click="editMode=true;openWidgetCatalog()"><span x-html="icon('plus',13)"></span>Add a widget</button>
            </div>
          </template>
        </div>
      </div>
    </template>
  </main>
</div>

<!-- ════ Match picker modal ════ -->
<div class="modal-bg" x-show="showMatch" x-cloak @click.self="showMatch=false">
  <div class="card p-6 w-[640px] max-h-[85vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-white tracking-tight">Load a match</h2>
      <button class="text-gray-500 hover:text-white" @click="showMatch=false" x-html="icon('x',18)"></button>
    </div>

    <div class="card p-4 mb-3 border-[#33333f]" style="background:var(--panel2)">
      <div class="flex items-center gap-2 mb-2.5">
        <span class="text-[#ff6b85]" x-html="icon('target',17)"></span>
        <span class="font-semibold text-white text-sm">Real matches</span>
        <span class="pill badge-pass">StatsBomb Open Data</span>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <select x-model="selectedComp" @change="loadMatches()" :disabled="compLoading" class="text-xs">
          <option value="" disabled selected x-text="compLoading?'Loading…':'Competition & season'"></option>
          <template x-for="c in competitions" :key="c.competition_id+'-'+c.season_id"><option :value="c.competition_id+':'+c.season_id" x-text="c.label"></option></template>
        </select>
        <select x-model="selectedMatch" @change="analyzeMatch()" :disabled="!matchList.length||matchLoading" class="text-xs">
          <option value="" disabled selected x-text="matchLoading?'Loading…':(matchList.length?'Pick a match':'Pick a competition first')"></option>
          <template x-for="m in matchList" :key="m.match_id"><option :value="m.match_id" x-text="m.label+'  ·  '+m.match_date"></option></template>
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="card p-4" style="background:var(--panel2)">
        <div class="w-9 h-9 rounded-lg bg-[#dc143c1a] text-[#ff6b85] flex items-center justify-center mb-2" x-html="icon('zap',18)"></div>
        <div class="font-semibold text-white text-sm mb-1">Demo match</div>
        <div class="text-xs text-gray-500 mb-3">Synthetic Man Utd vs Man City.</div>
        <button class="btn btn-primary btn-sm w-full justify-center" @click="loadSample()">Load demo</button>
      </div>
      <div class="card p-4" style="background:var(--panel2)">
        <div class="w-9 h-9 rounded-lg bg-[#dc143c1a] text-[#ff6b85] flex items-center justify-center mb-2" x-html="icon('upload',18)"></div>
        <div class="font-semibold text-white text-sm mb-1">Upload JSON</div>
        <div class="drop-zone mt-1" @click="$refs.fi.click()" @dragover.prevent @drop.prevent="handleDrop($event)">
          <div class="text-xs text-gray-400">Drop a StatsBomb <strong class="text-white">.json</strong></div>
          <input type="file" accept=".json" x-ref="fi" class="hidden" @change="handleFile($event)">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ════ Template picker ════ -->
<div class="modal-bg" x-show="showTemplate" x-cloak @click.self="showTemplate=false">
  <div class="card p-6 w-[640px] max-h-[85vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-white tracking-tight">New dashboard</h2>
      <button class="text-gray-500 hover:text-white" @click="showTemplate=false" x-html="icon('x',18)"></button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <template x-for="t in templates" :key="t.key">
        <div class="card p-4 cursor-pointer hover:border-[#dc143c66] group" style="background:var(--panel2)" @click="createFromTemplate(t)">
          <div class="w-9 h-9 rounded-lg bg-[#dc143c1a] text-[#ff6b85] flex items-center justify-center mb-2 group-hover:bg-[#dc143c2a] transition" x-html="icon(t.icon,18)"></div>
          <div class="font-semibold text-white text-sm" x-text="t.name"></div>
          <div class="text-xs text-gray-500 mt-1 leading-relaxed" x-text="t.description"></div>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- ════ Widget catalog ════ -->
<div class="modal-bg" x-show="showCatalog" x-cloak @click.self="showCatalog=false">
  <div class="card p-6 w-[560px] max-h-[85vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-white tracking-tight">Add a widget</h2>
      <button class="text-gray-500 hover:text-white" @click="showCatalog=false" x-html="icon('x',18)"></button>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <template x-for="wt in widgetCatalog" :key="wt.type">
        <div class="card p-3 cursor-pointer hover:border-[#dc143c66] flex gap-2.5 items-start" style="background:var(--panel2)" @click="addWidget(wt)">
          <span class="w-8 h-8 rounded-lg bg-[#dc143c1a] text-[#ff6b85] flex items-center justify-center flex-none" x-html="icon(wt.icon,16)"></span>
          <div>
            <div class="font-semibold text-white text-sm" x-text="wt.label"></div>
            <div class="text-[11px] text-gray-500 leading-snug" x-text="wt.desc"></div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>

<script>
function bi(){
  return {
    loading:false, loadingMsg:'Loading…', toast:'', toastErr:false,
    dbAvailable:false, dbBackend:'',
    templates:[], dashboards:[], activeDash:null, editMode:false,
    matchData:null, activeTeam:'', matchLabel:'', matchCache:{},
    notes:[], training:[], shortlist:[],
    noteDraft:{}, slDraft:{player_name:'',position:'',notes:''}, trDraft:{session_date:new Date().toISOString().slice(0,10),focus:'',rpe:null,duration_min:null},
    showMatch:false, showTemplate:false, showCatalog:false,
    competitions:[], compLoading:false, selectedComp:'', matchList:[], matchLoading:false, selectedMatch:'',

    widgetCatalog:[
      {type:'kpi',title:'Match KPIs',icon:'bar',label:'KPI cards',desc:'Key match metrics',w:2},
      {type:'heatmap',title:'Defensive Weakness',icon:'map',label:'Weakness heatmap',desc:'Opponent vulnerable zones',w:1},
      {type:'network',title:'Pass Network',icon:'network',label:'Pass network',desc:'Player connections',w:1,config:{min_passes:3}},
      {type:'pressing',title:'Pressing',icon:'zap',label:'Pressing map',desc:'High-press sequences',w:1},
      {type:'players',title:'Progressive Passers',icon:'user',label:'Player bar chart',desc:'Progressive passing',w:1},
      {type:'note',title:'Notes & Suggestions',icon:'file',label:'Notes',desc:'Your recommendations',w:2,config:{scope:'general'}},
      {type:'shortlist',title:'Shortlist',icon:'search',label:'Recruitment shortlist',desc:'Scouting targets',w:2},
      {type:'training_chart',title:'Training Load',icon:'activity',label:'Training chart',desc:'RPE / load over time',w:2,config:{metric:'rpe'}},
      {type:'markdown',title:'Text note',icon:'file',label:'Text block',desc:'Free-form notes',w:1,config:{text:''}},
    ],

    // ── icons (Feather-style, MIT) ──
    icon(name,size=16){
      const P={
        grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
        clipboard:'<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/>',
        search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
        activity:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
        users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
        edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>',
        save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
        trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
        bar:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
        map:'<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>',
        network:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
        zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
        user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
        target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
        upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
        up:'<polyline points="18 15 12 9 6 15"/>',
        down:'<polyline points="6 9 12 15 18 9"/>',
        x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
        check:'<polyline points="20 6 9 17 4 12"/>',
        alert:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
        database:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
        expand:'<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>',
        collapse:'<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/>',
      };
      return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[name]||P.grid}</svg>`;
    },
    logoMark(size=36){
      return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="rpg${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b5c"/><stop offset="1" stop-color="#a00b22"/></linearGradient></defs>
        <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#rpg${size})"/>
        <g stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".55"><line x1="14" y1="33" x2="24" y2="14"/><line x1="24" y1="14" x2="34" y2="33"/><line x1="14" y1="33" x2="34" y2="33"/></g>
        <g fill="#fff"><circle cx="14" cy="33" r="3.4"/><circle cx="24" cy="14" r="3.4"/><circle cx="34" cy="33" r="3.4"/></g>
      </svg>`;
    },
    widgetIcon(t){ return {kpi:'bar',heatmap:'map',network:'network',pressing:'zap',players:'user',note:'file',shortlist:'search',training_chart:'activity',markdown:'file'}[t]||'grid'; },
    contextIcon(c){ return {match:'clipboard',recruitment:'search',training:'activity',squad:'users',custom:'grid'}[c]||'grid'; },

    async init(){
      const st=await this.apiGet('/api/db-status').catch(()=>({available:false}));
      this.dbAvailable=st.available; this.dbBackend=st.backend||'';
      const tp=await this.apiGet('/api/templates').catch(()=>({templates:[]}));
      this.templates=tp.templates;
      await this.refreshAll();
      this.loadCompetitions();
    },

    // ── storage abstraction ──
    storageLabel(){ return this.dbAvailable ? (this.dbBackend==='postgres'?'Synced':'Saved') : 'Saved in browser'; },
    localKey(c){ return 'redpipe_'+c; },
    localGet(c){ try{ return JSON.parse(localStorage.getItem(this.localKey(c))||'[]'); }catch(e){ return []; } },
    localSet(c,a){ localStorage.setItem(this.localKey(c),JSON.stringify(a)); },
    localCreate(c,o){ const a=this.localGet(c); const id=a.reduce((m,x)=>Math.max(m,x.id||0),0)+1; const row={...o,id,created_at:new Date().toISOString(),updated_at:new Date().toISOString()}; a.unshift(row); this.localSet(c,a); return row; },
    localUpdate(c,id,p){ const a=this.localGet(c); const i=a.findIndex(x=>x.id===id); if(i>=0){ a[i]={...a[i],...p,updated_at:new Date().toISOString()}; this.localSet(c,a); return a[i]; } return null; },
    localDelete(c,id){ this.localSet(c,this.localGet(c).filter(x=>x.id!==id)); return {deleted:true}; },
    async dataList(c){ if(this.dbAvailable){ const d=await this.apiGet('/api/'+c); return d[c]; } return this.localGet(c); },
    async dataCreate(c,o){ return this.dbAvailable ? this.apiSend('/api/'+c,'POST',o) : this.localCreate(c,o); },
    async dataUpdate(c,id,o){ return this.dbAvailable ? this.apiSend('/api/'+c+'/'+id,'PUT',o) : this.localUpdate(c,id,o); },
    async dataDelete(c,id){ return this.dbAvailable ? this.apiSend('/api/'+c+'/'+id,'DELETE',{}) : this.localDelete(c,id); },

    // ── helpers ──
    uid(){ return (crypto.randomUUID?crypto.randomUUID():'w'+Math.random().toString(36).slice(2)); },
    notify(m,e=false){ this.toast=m; this.toastErr=e; setTimeout(()=>this.toast='',3000); },
    async apiGet(u){ const r=await fetch(u); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||r.status); return r.json(); },
    async apiSend(u,m,b){ const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||r.status); return r.json(); },
    async refreshAll(){
      const [d,n,t,s]=await Promise.all([this.dataList('dashboards').catch(()=>[]),this.dataList('notes').catch(()=>[]),this.dataList('training').catch(()=>[]),this.dataList('shortlist').catch(()=>[])]);
      this.dashboards=d; this.notes=n; this.training=t; this.shortlist=s;
    },
    teamData(){ return (this.matchData&&this.activeTeam)?this.matchData.by_team[this.activeTeam]:null; },
    notesFor(scope){ return this.notes.filter(n=>(!scope||scope==='general')?true:n.scope===scope); },
    dashNeedsMatch(){ return this.activeDash && this.activeDash.layout.some(w=>['kpi','heatmap','network','pressing','players'].includes(w.type)); },

    // ── dashboards ──
    openTemplatePicker(){ this.showTemplate=true; },
    async createFromTemplate(t){
      this.showTemplate=false;
      const layout=(t.layout||[]).map(w=>({...w,uid:this.uid(),config:w.config?{...w.config}:{}}));
      try{ const d=await this.dataCreate('dashboards',{name:t.name,context:t.context,layout}); this.dashboards.unshift(d); this.openDashboard(d); this.notify('Dashboard created'); }
      catch(e){ this.notify(e.message,true); }
    },
    openDashboard(d){
      this.activeDash=JSON.parse(JSON.stringify(d));
      this.activeDash.layout=(this.activeDash.layout||[]).map(w=>({...w,uid:w.uid||this.uid(),config:w.config||{}}));
      this.editMode=false; this.$nextTick(()=>this.renderDashboardCharts());
    },
    async saveDashboard(){
      try{
        const body={name:this.activeDash.name,context:this.activeDash.context,layout:this.activeDash.layout};
        if(this.activeDash.id){ const d=await this.dataUpdate('dashboards',this.activeDash.id,body); const i=this.dashboards.findIndex(x=>x.id===this.activeDash.id); if(i>=0&&d) this.dashboards[i]=d; }
        else{ const d=await this.dataCreate('dashboards',body); this.activeDash.id=d.id; this.dashboards.unshift(d); }
        this.editMode=false; this.notify('Saved'); this.$nextTick(()=>this.renderDashboardCharts());
      }catch(e){ this.notify(e.message,true); }
    },
    async deleteDashboard(){
      if(!confirm('Delete this dashboard?')) return;
      if(this.activeDash.id){ try{ await this.dataDelete('dashboards',this.activeDash.id); }catch(e){} }
      this.dashboards=this.dashboards.filter(d=>d.id!==this.activeDash.id); this.activeDash=null; this.editMode=false;
    },

    // ── widgets ──
    openWidgetCatalog(){ this.showCatalog=true; },
    addWidget(wt){ this.showCatalog=false; this.activeDash.layout.push({type:wt.type,title:wt.title,w:wt.w||1,uid:this.uid(),config:wt.config?{...wt.config}:{}}); this.$nextTick(()=>this.renderDashboardCharts()); },
    removeWidget(i){ this.activeDash.layout.splice(i,1); },
    moveWidget(i,dir){ const j=i+dir; if(j<0||j>=this.activeDash.layout.length) return; const a=this.activeDash.layout; [a[i],a[j]]=[a[j],a[i]]; this.$nextTick(()=>this.renderDashboardCharts()); },
    toggleWidth(w){ w.w=w.w===2?1:2; this.$nextTick(()=>this.renderDashboardCharts()); },

    // ── match data ──
    openMatchPicker(){ this.showMatch=true; if(!this.competitions.length) this.loadCompetitions(); },
    async loadCompetitions(){ this.compLoading=true; try{ const d=await this.apiGet('/api/competitions'); this.competitions=d.competitions; }catch(e){} finally{ this.compLoading=false; } },
    async loadMatches(){ if(!this.selectedComp) return; const[c,s]=this.selectedComp.split(':'); this.matchLoading=true; this.matchList=[]; this.selectedMatch=''; try{ const d=await this.apiGet(`/api/matches?competition_id=${c}&season_id=${s}`); this.matchList=d.matches; }catch(e){ this.notify(e.message,true); } finally{ this.matchLoading=false; } },
    async analyzeMatch(){ if(!this.selectedMatch) return; const m=this.matchList.find(x=>x.match_id==this.selectedMatch); await this.loadMatch('/api/analyze/'+this.selectedMatch, m?m.label:('Match '+this.selectedMatch)); },
    async loadSample(){ await this.loadMatch('/api/sample','Demo: Man Utd vs Man City'); },
    async handleFile(e){ const f=e.target.files[0]; if(f) await this.uploadFile(f); },
    async handleDrop(e){ const f=e.dataTransfer.files[0]; if(f) await this.uploadFile(f); },
    async uploadFile(file){ if(!file.name.endsWith('.json')){ this.notify('Need a .json file',true); return;} const fd=new FormData(); fd.append('file',file); this.loadingMsg='Processing upload…'; this.loading=true; try{ const r=await fetch('/api/upload',{method:'POST',body:fd}); if(!r.ok) throw new Error((await r.json()).detail); this.setMatch(await r.json(),file.name); }catch(e){ this.notify(e.message,true);} finally{ this.loading=false; } },
    async loadMatch(url,label){
      this.loadingMsg='Fetching match & running analytics…'; this.loading=true;
      try{ let data=this.matchCache[url]; if(!data){ data=await this.apiGet(url); this.matchCache[url]=data; } this.setMatch(data,label); }
      catch(e){ this.notify(e.message,true); } finally{ this.loading=false; }
    },
    setMatch(data,label){ this.matchData=data; this.activeTeam=data.teams[0]||''; this.matchLabel=label; this.showMatch=false; this.notify('Match loaded'); this.$nextTick(()=>this.renderDashboardCharts()); },

    // ── notes / shortlist / training ──
    async addNote(w){ const t=this.noteDraft[w.uid+'_t']||'',b=this.noteDraft[w.uid+'_b']||''; if(!b.trim()) return; try{ const n=await this.dataCreate('notes',{scope:w.config.scope||'general',title:t,body:b,ref_id:this.matchData?this.matchData.match_id:null,ref_label:this.matchLabel,tags:[]}); this.notes.unshift(n); this.noteDraft[w.uid+'_t']=''; this.noteDraft[w.uid+'_b']=''; }catch(e){ this.notify(e.message,true); } },
    async deleteNote(id){ try{ await this.dataDelete('notes',id); this.notes=this.notes.filter(n=>n.id!==id);}catch(e){ this.notify(e.message,true);} },
    async addShortlist(){ if(!this.slDraft.player_name.trim()) return; try{ const s=await this.dataCreate('shortlist',{player_name:this.slDraft.player_name,position:this.slDraft.position,notes:this.slDraft.notes,status:'watch',rating:3,tags:[]}); this.shortlist.unshift(s); this.slDraft={player_name:'',position:'',notes:''}; }catch(e){ this.notify(e.message,true);} },
    async updateShortlist(s){ try{ await this.dataUpdate('shortlist',s.id,{status:s.status,rating:s.rating,notes:s.notes}); }catch(e){ this.notify(e.message,true);} },
    cycleRating(s){ s.rating=((s.rating||0)%5)+1; this.updateShortlist(s); },
    async deleteShortlist(id){ try{ await this.dataDelete('shortlist',id); this.shortlist=this.shortlist.filter(s=>s.id!==id);}catch(e){ this.notify(e.message,true);} },
    async addTraining(){ if(!this.trDraft.session_date) return; try{ const t=await this.dataCreate('training',{session_date:this.trDraft.session_date,focus:this.trDraft.focus,rpe:this.trDraft.rpe,duration_min:this.trDraft.duration_min,metrics:{}}); this.training.push(t); this.training.sort((a,b)=>a.session_date.localeCompare(b.session_date)); this.trDraft={session_date:new Date().toISOString().slice(0,10),focus:'',rpe:null,duration_min:null}; this.$nextTick(()=>this.renderDashboardCharts()); }catch(e){ this.notify(e.message,true);} },

    // ── charts ──
    renderDashboardCharts(){ if(!this.activeDash) return; this.activeDash.layout.forEach(w=>this.renderOneWidget(w)); },
    renderOneWidget(w){
      const el=document.getElementById('chart-'+w.uid); if(!el) return;
      if(w.type==='training_chart'){ this.renderTraining(el); return; }
      const td=this.teamData(); if(!td){ el.innerHTML='<div class="text-sm text-gray-600 py-10 text-center">Load a match to populate.</div>'; return; }
      if(w.type==='heatmap') this.renderHeatmap(el,td);
      if(w.type==='network') this.renderNetwork(el,td,w.config.min_passes||3);
      if(w.type==='pressing') this.renderPressing(el,td);
      if(w.type==='players') this.renderPlayers(el,td);
    },
    pitchShapes(){const lc='rgba(255,255,255,.22)',lw=1.5;return[{type:'rect',x0:0,y0:0,x1:120,y1:80,line:{color:lc,width:lw},fillcolor:'rgba(20,80,20,.18)'},{type:'line',x0:60,y0:0,x1:60,y1:80,line:{color:lc,width:lw}},{type:'circle',x0:50,y0:30,x1:70,y1:50,line:{color:lc,width:lw}},{type:'rect',x0:0,y0:18,x1:18,y1:62,line:{color:lc,width:lw},fillcolor:'rgba(0,0,0,0)'},{type:'rect',x0:102,y0:18,x1:120,y1:62,line:{color:lc,width:lw},fillcolor:'rgba(0,0,0,0)'}];},
    pitchLayout(ex={}){return{paper_bgcolor:'#15151d',plot_bgcolor:'#15151d',font:{color:'#9a9aa8',family:'Inter'},xaxis:{range:[0,120],showgrid:false,zeroline:false,visible:false},yaxis:{range:[0,80],showgrid:false,zeroline:false,visible:false,scaleanchor:'x',scaleratio:1},shapes:this.pitchShapes(),margin:{t:10,b:10,l:10,r:10},...ex};},
    baseLayout(ex={}){return{paper_bgcolor:'#15151d',plot_bgcolor:'#15151d',font:{color:'#9a9aa8',family:'Inter'},xaxis:{color:'#7a7a88',gridcolor:'#272733'},yaxis:{color:'#7a7a88',gridcolor:'#272733'},margin:{t:10,b:60,l:40,r:10},...ex};},
    renderHeatmap(el,td){
      const pts=td.heatmap.points,f=pts.filter(p=>p.type==='Defensive failure'),pr=pts.filter(p=>p.type!=='Defensive failure'),tr=[];
      if(pts.length>5) tr.push({x:pts.map(p=>p.x),y:pts.map(p=>p.y),type:'histogram2dcontour',colorscale:[['0','rgba(220,20,60,0)'],['1','rgba(220,20,60,.42)']],showscale:false,ncontours:12,contours:{coloring:'fill'},line:{width:0},hoverinfo:'skip'});
      if(f.length) tr.push({x:f.map(p=>p.x),y:f.map(p=>p.y),mode:'markers',type:'scatter',marker:{color:'#f97316',opacity:.6,size:6},hoverinfo:'skip'});
      if(pr.length) tr.push({x:pr.map(p=>p.x),y:pr.map(p=>p.y),mode:'markers',type:'scatter',marker:{color:'#60a5fa',opacity:.6,size:6},hoverinfo:'skip'});
      Plotly.react(el,tr,this.pitchLayout({showlegend:false}),{responsive:true,displayModeBar:false});
    },
    renderNetwork(el,td,mp){
      const {nodes,edges}=td.network,fe=edges.filter(e=>e.weight>=mp);
      if(!nodes.length){el.innerHTML='<div class="text-gray-600 text-sm py-10 text-center">No pass data.</div>';return;}
      const maxB=Math.max(...nodes.map(n=>n.betweenness),.001),maxP=Math.max(...nodes.map(n=>n.passes_made),1);
      const et=fe.map(e=>{const a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to);if(!a||!b)return null;return{x:[a.x,b.x,null],y:[a.y,b.y,null],mode:'lines',type:'scatter',line:{color:`rgba(190,190,205,${Math.min(.1+e.weight/30,.5)})`,width:Math.max(.5,e.weight/4)},hoverinfo:'skip'};}).filter(Boolean);
      const nt={x:nodes.map(n=>n.x),y:nodes.map(n=>n.y),mode:'markers+text',type:'scatter',text:nodes.map(n=>n.name.split(' ').pop()),textfont:{color:'#e7e7ee',size:9},textposition:'top center',hovertemplate:nodes.map(n=>`<b>${n.name}</b><br>Made:${n.passes_made} Recv:${n.passes_received}<br>Influence:${n.betweenness}<extra></extra>`),marker:{size:nodes.map(n=>9+n.passes_made/maxP*26),color:nodes.map(n=>n.betweenness/maxB),colorscale:'RdYlBu_r',cmin:0,cmax:1,line:{width:1.4,color:'#fff'}}};
      Plotly.react(el,[...et,nt],this.pitchLayout({showlegend:false}),{responsive:true,displayModeBar:false});
    },
    renderPressing(el,td){
      const s=td.pressing.sequences;
      if(!s.length){el.innerHTML='<div class="text-gray-600 text-sm py-10 text-center">No pressing sequences.</div>';return;}
      Plotly.react(el,[{x:s.map(d=>d.x),y:s.map(d=>d.y),mode:'markers',type:'scatter',marker:{size:s.map(d=>d.actions*7),color:s.map(d=>d.actions),colorscale:'Reds',cmin:3,opacity:.85,line:{width:1.4,color:'#fff'}},hovertemplate:s.map(d=>`Seq ${d.id}<br>${d.minute}:${String(d.second).padStart(2,'0')}<br>Actions:${d.actions}<extra></extra>`)}],this.pitchLayout(),{responsive:true,displayModeBar:false});
    },
    renderPlayers(el,td){
      const ps=[...td.players.players].sort((a,b)=>b.progressive_passes-a.progressive_passes).slice(0,12),avg=td.players.league_avg_progressive;
      Plotly.react(el,[{x:ps.map(p=>p.name.split(' ').pop()),y:ps.map(p=>p.progressive_passes),type:'bar',marker:{color:ps.map(p=>p.progressive_passes>=avg?'#dc143c':'#4b4b58')},hovertemplate:ps.map(p=>`<b>${p.name}</b><br>Prog:${p.progressive_passes}<br>Compl:${p.completion_pct}%<extra></extra>`)}],this.baseLayout({xaxis:{tickangle:-30,color:'#7a7a88',gridcolor:'#272733'},yaxis:{title:'Progressive',color:'#7a7a88',gridcolor:'#272733'},shapes:[{type:'line',x0:-.5,y0:avg,x1:ps.length-.5,y1:avg,line:{color:'#fbbf24',width:2,dash:'dot'}}]}),{responsive:true,displayModeBar:false});
    },
    renderTraining(el){
      if(!this.training.length){el.innerHTML='<div class="text-gray-600 text-sm py-10 text-center">No training sessions logged yet.</div>';return;}
      const t=[...this.training].sort((a,b)=>a.session_date.localeCompare(b.session_date));
      Plotly.react(el,[
        {x:t.map(s=>s.session_date),y:t.map(s=>s.rpe),type:'bar',name:'RPE',marker:{color:'#dc143c'},yaxis:'y'},
        {x:t.map(s=>s.session_date),y:t.map(s=>s.duration_min),type:'scatter',mode:'lines+markers',name:'Duration (min)',line:{color:'#fbbf24'},yaxis:'y2'}
      ],this.baseLayout({margin:{t:10,b:50,l:40,r:40},legend:{font:{size:10},orientation:'h'},yaxis:{title:'RPE',color:'#7a7a88',gridcolor:'#272733',range:[0,10]},yaxis2:{title:'Min',overlaying:'y',side:'right',color:'#7a7a88'},xaxis:{color:'#7a7a88',gridcolor:'#272733'}}),{responsive:true,displayModeBar:false});
    },
  };
}
</script>
</body>
</html>
